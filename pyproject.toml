[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antiecho"
version = "0.1.0"
description = "Stop LLM context echoing, repetition spirals, and memory poisoning in multi-turn chats."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["llm", "ai", "context", "prompt-compression", "anti-echo", "hallucination", "memory", "agents", "openai", "claude"]
authors = [
    { name = "AntiEcho Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
antiecho = "antiecho.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["antiecho"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
